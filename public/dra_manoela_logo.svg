<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Rich professional dental teal gradient with subtle highlight -->
    <radialGradient id="tealGradient" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#14A8A2" />
      <stop offset="60%" stop-color="#0E8E89" />
      <stop offset="100%" stop-color="#096E6A" />
    </radialGradient>
    <!-- Soft inner glow ring -->
    <linearGradient id="ringGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Circular Base -->
  <circle cx="160" cy="160" r="154" fill="url(#tealGradient)" />
  <circle cx="160" cy="160" r="152" fill="none" stroke="url(#ringGlow)" stroke-width="2" />

  <!-- Stylized Monogram M (Dynamic flowing dual-contour dental roots / aesthetic M) -->
  <g transform="translate(160, 102) scale(1.05)" fill="#FFFFFF">
    <!-- Outer calligraphic M contour with inner hollow -->
    <path d="M -54,-62 C -36,-64 -18,-35 -8,-16 C -2,-4 0,-4 6,-16 C 16,-35 34,-64 52,-62 C 67,-60 69,-40 64,-20 C 58,4 47,38 33,62 C 30,67 25,69 22,65 C 20,61 22,53 25,44 C 33,21 38,-4 36,-24 C 34,-38 27,-44 18,-34 C 8,-22 2,-4 -2,8 C -4,12 -8,12 -10,8 C -14,-4 -20,-22 -30,-34 C -39,-44 -46,-38 -48,-24 C -50,-4 -45,21 -37,44 C -34,53 -32,61 -34,65 C -37,69 -42,67 -45,62 C -59,38 -70,4 -76,-20 C -81,-40 -70,-60 -54,-62 Z M -34,-26 C -31,-14 -32,10 -37,28 C -36,29 -35,28 -34,26 C -29,11 -25,-10 -22,-20 C -18,-32 -13,-42 -8,-48 C -12,-48 -18,-45 -22,-40 C -28,-33 -32,-27 -34,-26 Z M 22,-20 C 25,-10 29,11 34,26 C 35,28 36,29 37,28 C 32,10 31,-14 34,-26 C 32,-27 28,-33 22,-40 C 18,-45 12,-48 8,-48 C 13,-42 18,-32 22,-20 Z" />
  </g>

  <!-- Title: Dra. Manoela Maia -->
  <text x="160" y="238" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="'Cormorant Garamond', Georgia, serif" 
        font-size="23" 
        font-weight="600" 
        letter-spacing="0.6">
    Dra. Manoela Maia
  </text>

  <!-- Subtitle: REABILITAÇÃO ORAL & -->
  <text x="160" y="258" 
        text-anchor="middle" 
        fill="#E2F8F5" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="2.2">
    REABILITAÇÃO ORAL &amp;
  </text>

  <!-- Subtitle line 2: ODONTOLOGIA ESTÉTICA -->
  <text x="160" y="271" 
        text-anchor="middle" 
        fill="#E2F8F5" 
        font-family="'Plus Jakarta Sans', -apple-system, sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="2.2">
    ODONTOLOGIA ESTÉTICA
  </text>
</svg>
